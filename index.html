<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Axiom Exchange View</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, 'Inter', sans-serif;
            background: #131722; color: #d1d4dc;
            overflow-x: hidden;
            padding-bottom: 70px; /* место под нижние табы */
        }

        /* РЕКЛАМНЫЙ БАННЕР */
        .promo {
            background: linear-gradient(90deg, #2962ff, #7c4dff, #2962ff);
            background-size: 200% 100%;
            animation: promoShift 6s linear infinite;
            color: #fff;
            padding: 7px 14px;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 600;
            position: relative;
            overflow: hidden;
        }
        .promo span { color: #ffd54f; }
        @keyframes promoShift { 0% { background-position: 0% 0; } 100% { background-position: 200% 0; } }

        /* ХЕДЕР */
        .topbar {
            padding: 12px 16px;
            background: #1a1e2a;
            border-bottom: 1px solid #2a2e39;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .topbar h1 { font-size: 1.1rem; color: #fff; }
        .topbar h1 span { color: #2962ff; }
        .status { font-size: 0.7rem; padding: 3px 8px; border-radius: 4px; background: #2a2e39; white-space: nowrap; }
        .status.live { color: #26a69a; }
        .status.error { color: #ef5350; }

        /* ВИДЫ (вкладки) */
        .view { display: none; }
        .view.active { display: block; }

        /* СПИСОК ИНСТРУМЕНТОВ */
        .instrument-list { padding: 8px 0; }
        .instrument-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            border-bottom: 1px solid #2a2e39;
            cursor: pointer;
            transition: background 0.15s;
        }
        .instrument-item:hover, .instrument-item:active { background: #1e222d; }
        .instrument-left { display: flex; flex-direction: column; gap: 2px; }
        .instrument-name { font-size: 0.95rem; font-weight: 600; color: #fff; }
        .instrument-sub { font-size: 0.72rem; color: #787b86; }
        .instrument-right { display: flex; align-items: center; gap: 12px; }
        .instrument-price { font-family: monospace; font-size: 0.9rem; font-weight: 600; }
        .price-up { color: #26a69a; }
        .price-down { color: #ef5350; }
        .fav-mini { font-size: 1.1rem; color: #4a4f5c; cursor: pointer; padding: 4px; }
        .fav-mini.active { color: #ffca28; }

        /* ПОЛНОЭКРАННЫЙ ГРАФИК */
        .chart-view {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #131722;
            z-index: 200;
            flex-direction: column;
        }
        .chart-view.active { display: flex; }
        .chart-view-header {
            padding: 12px 16px;
            background: #1a1e2a;
            border-bottom: 1px solid #2a2e39;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .back-btn {
            background: none; border: none; color: #fff;
            font-size: 1.4rem; cursor: pointer; padding: 4px 8px;
        }
        .chart-view-title { flex-grow: 1; }
        .chart-view-title h2 { font-size: 1rem; color: #fff; }
        .chart-view-title .sub { font-size: 0.72rem; color: #787b86; }
        .chart-view-price { font-family: monospace; font-size: 1rem; font-weight: 700; }

        .chart-view-body { flex-grow: 1; position: relative; }
        .chart-view-body .chart-container { width: 100%; height: 100%; }
        .chart-view-body .draw-canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
            touch-action: none;
        }
        .chart-view-body .draw-canvas.active { pointer-events: auto; cursor: crosshair; }

        /* ПАНЕЛЬ ИНСТРУМЕНТОВ */
        .tools-panel {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            background: rgba(42, 46, 57, 0.95);
            backdrop-filter: blur(10px);
            padding: 6px 8px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            z-index: 30;
            flex-wrap: wrap;
            justify-content: center;
            max-width: calc(100vw - 32px);
        }
        .tool-btn {
            background: #1e222d;
            border: 1px solid #363a45;
            color: #d1d4dc;
            padding: 8px 11px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            line-height: 1;
            transition: all 0.15s;
        }
        .tool-btn:hover { background: #363a45; }
        .tool-btn.active { background: #2962ff; border-color: #2962ff; color: #fff; }
        .tools-toggle {
            position: absolute;
            bottom: 16px;
            right: 16px;
            background: #2962ff;
            border: none;
            color: #fff;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(41, 98, 255, 0.5);
            z-index: 31;
        }
        .tools-toggle.hidden { display: none; }

        /* НИЖНИЕ ВКЛАДКИ */
        .bottom-tabs {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: #1a1e2a;
            border-top: 1px solid #2a2e39;
            display: flex;
            justify-content: space-around;
            padding: 8px 0 6px;
            z-index: 100;
        }
        .bottom-tab {
            flex: 1;
            background: none;
            border: none;
            color: #787b86;
            cursor: pointer;
            padding: 6px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            font-size: 0.68rem;
            transition: color 0.15s;
        }
        .bottom-tab .icon { font-size: 1.3rem; line-height: 1; }
        .bottom-tab.active { color: #2962ff; }

        /* ПРОФИЛЬ */
        .profile-wrap { padding: 24px 18px; max-width: 520px; margin: 0 auto; }
        .profile-card { background: #1e222d; border-radius: 14px; padding: 24px; border: 1px solid #2a2e39; }
        .profile-avatar {
            width: 76px; height: 76px; border-radius: 50%;
            background: linear-gradient(135deg, #2962ff, #7c4dff);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.9rem; color: #fff; font-weight: 700;
            margin: 0 auto 18px;
        }
        .profile-field { margin-bottom: 14px; }
        .profile-field label {
            display: block; font-size: 0.72rem; color: #787b86;
            margin-bottom: 6px; text-transform: uppercase;
        }
        .profile-field input {
            width: 100%; padding: 11px 14px;
            background: #131722; border: 1px solid #363a45;
            border-radius: 8px; color: #fff; font-size: 0.95rem;
            font-family: inherit; outline: none;
        }
        .profile-field input:focus { border-color: #2962ff; }
        .profile-save {
            width: 100%; padding: 12px;
            background: #2962ff; border: none; border-radius: 8px;
            color: #fff; font-size: 0.95rem; font-weight: 600;
            cursor: pointer; margin-top: 8px;
        }
        .profile-save.saved { background: #26a69a; }
        .profile-stats {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
            margin-top: 18px; padding-top: 18px;
            border-top: 1px solid #2a2e39;
        }
        .stat-box { text-align: center; padding: 12px; background: #131722; border-radius: 8px; }
        .stat-value { font-size: 1.4rem; font-weight: 700; color: #2962ff; }
        .stat-label { font-size: 0.72rem; color: #787b86; margin-top: 4px; }

        /* ПУСТОЕ СОСТОЯНИЕ */
        .empty { text-align: center; padding: 60px 20px; color: #787b86; }
        .empty-icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.4; }
        .empty-text { font-size: 0.95rem; margin-bottom: 6px; }
        .empty-hint { font-size: 0.78rem; color: #4a4f5c; }

        /* ЗАГРУЗКА */
        .loading-row { text-align: center; padding: 30px; color: #787b86; font-size: 0.85rem; }
    </style>
</head>
<body>

<!-- РЕКЛАМНЫЙ БАННЕР -->
<div class="promo">🚀 Биржа <span>Axiom Exchange</span> очень скоро — следите за запуском!</div>

<!-- ТОП-БАР -->
<div class="topbar">
    <h1>Axiom <span>Exchange View</span></h1>
    <div class="status" id="global-status">Загрузка...</div>
</div>

<!-- ВИД: КРИПТОВАЛЮТА -->
<div class="view active" id="view-crypto">
    <div class="instrument-list" id="list-crypto">
        <div class="loading-row">Загрузка криптовалют...</div>
    </div>
</div>

<!-- ВИД: АКЦИИ -->
<div class="view" id="view-stocks">
    <div class="instrument-list" id="list-stocks">
        <div class="loading-row">Загрузка акций...</div>
    </div>
</div>

<!-- ВИД: ВАЛЮТЫ -->
<div class="view" id="view-currency">
    <div class="instrument-list" id="list-currency">
        <div class="loading-row">Загрузка валют...</div>
    </div>
</div>

<!-- ВИД: ИЗБРАННОЕ -->
<div class="view" id="view-favorites">
    <div class="instrument-list" id="list-favorites">
        <div class="empty">
            <div class="empty-icon">⭐</div>
            <div class="empty-text">Пока нет избранных</div>
            <div class="empty-hint">Нажми ★ рядом с инструментом</div>
        </div>
    </div>
</div>

<!-- ВИД: ПРОФИЛЬ -->
<div class="view" id="view-profile">
    <div class="profile-wrap">
        <div class="profile-card">
            <div class="profile-avatar" id="avatar-preview">?</div>
            <div class="profile-field">
                <label>Имя</label>
                <input type="text" id="input-firstname" placeholder="Введи имя" maxlength="30">
            </div>
            <div class="profile-field">
                <label>Фамилия</label>
                <input type="text" id="input-lastname" placeholder="Введи фамилию" maxlength="30">
            </div>
            <button class="profile-save" id="save-profile">Сохранить</button>
            <div class="profile-stats">
                <div class="stat-box">
                    <div class="stat-value" id="stat-favs">0</div>
                    <div class="stat-label">В избранном</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="stat-instruments">0</div>
                    <div class="stat-label">Инструментов</div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ПОЛНОЭКРАННЫЙ ГРАФИК -->
<div class="chart-view" id="chart-view">
    <div class="chart-view-header">
        <button class="back-btn" id="back-btn">←</button>
        <div class="chart-view-title">
            <h2 id="chart-title">--</h2>
            <div class="sub" id="chart-sub">--</div>
        </div>
        <div class="chart-view-price" id="chart-price">--</div>
        <div class="fav-mini" id="chart-fav" style="font-size:1.3rem; cursor:pointer;">★</div>
    </div>
    <div class="chart-view-body">
        <div id="full-chart" class="chart-container"></div>
        <canvas id="full-canvas" class="draw-canvas"></canvas>

        <!-- Плавающая кнопка "Инструменты" -->
        <button class="tools-toggle" id="tools-toggle" title="Инструменты">✏️</button>

        <!-- Панель инструментов -->
        <div class="tools-panel" id="tools-panel" style="display:none;">
            <button class="tool-btn active" data-tool="none" title="Курсор">➤</button>
            <button class="tool-btn" data-tool="hline" title="Горизонт">─</button>
            <button class="tool-btn" data-tool="vline" title="Вертикаль">│</button>
            <button class="tool-btn" data-tool="trend" title="Тренд">╱</button>
            <button class="tool-btn" data-tool="pencil" title="Карандаш">✏️</button>
            <button class="tool-btn" data-tool="rect" title="Прямоугольник">▭</button>
            <button class="tool-btn" data-tool="fib" title="Fibo">≡</button>
            <button class="tool-btn" data-tool="eraser" title="Ластик">⌫</button>
            <button class="tool-btn" id="undo-btn" title="Отмена">↶</button>
            <button class="tool-btn" id="clear-btn" title="Очистить">🗑</button>
        </div>
    </div>
</div>

<!-- НИЖНИЕ ВКЛАДКИ -->
<div class="bottom-tabs">
    <button class="bottom-tab active" data-view="crypto">
        <span class="icon">🪙</span>
        <span>Крипта</span>
    </button>
    <button class="bottom-tab" data-view="stocks">
        <span class="icon">📊</span>
        <span>Акции</span>
    </button>
    <button class="bottom-tab" data-view="currency">
        <span class="icon">💱</span>
        <span>Валюты</span>
    </button>
    <button class="bottom-tab" data-view="favorites">
        <span class="icon">⭐</span>
        <span>Избранное</span>
    </button>
    <button class="bottom-tab" data-view="profile">
        <span class="icon">👤</span>
        <span>Профиль</span>
    </button>
</div>

<script>
// ============================================
// КОНФИГ ИНСТРУМЕНТОВ
// ============================================
const INSTRUMENTS = {
    crypto: [
        { symbol: 'BTCUSDT', name: 'BTC / USDT', sub: 'Bitcoin · Binance' },
        { symbol: 'ETHUSDT', name: 'ETH / USDT', sub: 'Ethereum · Binance' },
        { symbol: 'SOLUSDT', name: 'SOL / USDT', sub: 'Solana · Binance' },
        { symbol: 'BNBUSDT', name: 'BNB / USDT', sub: 'BNB · Binance' },
        { symbol: 'XRPUSDT', name: 'XRP / USDT', sub: 'Ripple · Binance' },
        { symbol: 'TONUSDT', name: 'TON / USDT', sub: 'Toncoin · Binance' },
        { symbol: 'DOGEUSDT', name: 'DOGE / USDT', sub: 'Dogecoin · Binance' },
        { symbol: 'ADAUSDT', name: 'ADA / USDT', sub: 'Cardano · Binance' }
    ],
    stocks: [
        { symbol: 'SBER', name: 'SBER', sub: 'Сбербанк · MOEX' },
        { symbol: 'GAZP', name: 'GAZP', sub: 'Газпром · MOEX' },
        { symbol: 'LKOH', name: 'LKOH', sub: 'Лукойл · MOEX' },
        { symbol: 'GMKN', name: 'GMKN', sub: 'Норникель · MOEX' },
        { symbol: 'ROSN', name: 'ROSN', sub: 'Роснефть · MOEX' },
        { symbol: 'NVTK', name: 'NVTK', sub: 'НОВАТЭК · MOEX' },
        { symbol: 'SNGS', name: 'SNGS', sub: 'Сургутнефтегаз · MOEX' },
        { symbol: 'TATN', name: 'TATN', sub: 'Татнефть · MOEX' },
        { symbol: 'MTSS', name: 'MTSS', sub: 'МТС · MOEX' },
        { symbol: 'MGNT', name: 'MGNT', sub: 'Магнит · MOEX' },
        { symbol: 'VTBR', name: 'VTBR', sub: 'ВТБ · MOEX' },
        { symbol: 'ALRS', name: 'ALRS', sub: 'АЛРОСА · MOEX' },
        { symbol: 'PLZL', name: 'PLZL', sub: 'Полюс · MOEX' },
        { symbol: 'CHMF', name: 'CHMF', sub: 'Северсталь · MOEX' },
        { symbol: 'NLMK', name: 'NLMK', sub: 'НЛМК · MOEX' },
        { symbol: 'AFLT', name: 'AFLT', sub: 'Аэрофлот · MOEX' },
        { symbol: 'PHOR', name: 'PHOR', sub: 'ФосАгро · MOEX' },
        { symbol: 'SIBN', name: 'SIBN', sub: 'Газпром нефть · MOEX' },
        { symbol: 'MOEX', name: 'MOEX', sub: 'Мосбиржа · MOEX' },
        { symbol: 'POLY', name: 'POLY', sub: 'Polymetal · MOEX' }
    ],
    currency: [
        { symbol: 'USD', name: 'USD / RUB', sub: 'Доллар · ЦБ РФ' },
        { symbol: 'EUR', name: 'EUR / RUB', sub: 'Евро · ЦБ РФ' },
        { symbol: 'CNY', name: 'CNY / RUB', sub: 'Юань · ЦБ РФ' }
    ]
};

const ALL_INSTRUMENTS = [...INSTRUMENTS.crypto, ...INSTRUMENTS.stocks, ...INSTRUMENTS.currency];

// ============================================
// ОБЩИЕ ОПЦИИ ГРАФИКА
// ============================================
const baseOptions = {
    layout: { background: { type: 'solid', color: '#131722' }, textColor: '#d1d4dc', fontSize: 11 },
    grid: { vertLines: { color: '#2a2e39' }, horzLines: { color: '#2a2e39' } },
    timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#2a2e39', rightOffset: 3 },
    rightPriceScale: { borderColor: '#2a2e39', scaleMargins: { top: 0.15, bottom: 0.1 } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    handleScroll: true, handleScale: true
};

const priceCache = {};   // symbol -> последняя цена
const prevCache = {};    // symbol -> предыдущая цена (для цвета)
const chartInstances = {}; // symbol -> { chart, series, drawingLayer }

// ============================================
// ЗАГРУЗКА ДАННЫХ
// ============================================
async function fetchCryptoHistory(symbol) {
    // Binance — стабильнее чем Bybit, работает с GitHub Pages
    const url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=1m&limit=300`;
    const res = await fetch(url);
    const data = await res.json();
    return data.map(k => ({
        time: Math.floor(k[0] / 1000),
        value: parseFloat(k[4])
    }));
}

async function fetchStockHistory(ticker) {
    const url = `https://iss.moex.com/iss/engines/stock/markets/shares/boards/TQBR/securities/${ticker}/candles.json?interval=24&limit=90`;
    const res = await fetch(url);
    const json = await res.json();
    if (!json.candles?.data) return [];
    return json.candles.data.map(c => ({
        time: Math.floor(new Date(c[6]).getTime() / 1000),
        value: c[1]
    })).sort((a, b) => a.time - b.time);
}

async function fetchCurrencyHistory(symbol) {
    // За 30 дней
    const today = new Date();
    const promises = [];
    for (let i = 30; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        const ds = d.toISOString().slice(0, 10);
        const [y, m, day] = ds.split('-');
        promises.push(
            fetch(`https://cbr-xml-daily.ru/archive/${y}/${m}/${day}/daily_json.js`)
                .then(r => r.ok ? r.json() : null)
                .then(j => {
                    if (!j?.Valute?.[symbol]) return null;
                    return { time: Math.floor(new Date(ds).getTime() / 1000), value: j.Valute[symbol].Value };
                })
                .catch(() => null)
        );
    }
    const results = await Promise.all(promises);
    return results.filter(Boolean).sort((a, b) => a.time - b.time);
}

// ============================================
// ЗАГРУЗКА СПИСКА (только цены)
// ============================================
async function loadListPrices() {
    // Крипта — один запрос на все тикеры Binance
    try {
        const symbols = INSTRUMENTS.crypto.map(i => i.symbol);
        const url = `https://api.binance.com/api/v3/ticker/price?symbols=${encodeURIComponent(JSON.stringify(symbols))}`;
        const res = await fetch(url);
        const data = await res.json();
        data.forEach(item => {
            const price = parseFloat(item.price);
            if (prevCache[item.symbol] !== undefined && prevCache[item.symbol] !== price) {
                prevCache[item.symbol] = priceCache[item.symbol];
            }
            priceCache[item.symbol] = price;
        });
    } catch (e) { console.warn('Binance list error', e); }

    // ЦБ — один запрос
    try {
        const res = await fetch('https://cbr-xml-daily.ru/daily_json.js');
        const data = await res.json();
        ['USD', 'EUR', 'CNY'].forEach(sym => {
            if (data.Valute?.[sym]) {
                const val = data.Valute[sym].Value;
                if (prevCache[sym] !== undefined && prevCache[sym] !== val) {
                    prevCache[sym] = priceCache[sym];
                }
                priceCache[sym] = val;
            }
        });
    } catch (e) { console.warn('CBR error', e); }

    // MOEX — по каждому тикеру
    const stockPromises = INSTRUMENTS.stocks.map(async inst => {
        try {
            const url = `https://iss.moex.com/iss/engines/stock/markets/shares/boards/TQBR/securities/${inst.symbol}.json?iss.meta=off&iss.only=marketdata&marketdata.columns=SECID,LAST`;
            const res = await fetch(url);
            const json = await res.json();
            const row = json.marketdata?.data?.[0];
            if (row && row[1]) {
                const val = parseFloat(row[1]);
                if (prevCache[inst.symbol] !== undefined && prevCache[inst.symbol] !== val) {
                    prevCache[inst.symbol] = priceCache[inst.symbol];
                }
                priceCache[inst.symbol] = val;
            }
        } catch (e) { /* тихо */ }
    });
    await Promise.all(stockPromises);

    renderAllLists();
    updateStats();
}

// ============================================
// ОТРИСОВКА СПИСКОВ
// ============================================
function renderInstrumentList(containerId, items) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = items.map(inst => {
        const price = priceCache[inst.symbol];
        const prev = prevCache[inst.symbol];
        let priceClass = '';
        if (prev !== undefined && price !== undefined) {
            priceClass = price >= prev ? 'price-up' : 'price-down';
        }
        const isFav = favorites.includes(inst.symbol);
        return `
            <div class="instrument-item" data-symbol="${inst.symbol}">
                <div class="instrument-left">
                    <div class="instrument-name">${inst.name}</div>
                    <div class="instrument-sub">${inst.sub}</div>
                </div>
                <div class="instrument-right">
                    <div class="instrument-price ${priceClass}" data-price="${inst.symbol}">
                        ${price !== undefined ? price.toLocaleString('ru-RU', { maximumFractionDigits: 2 }) : '--'}
                    </div>
                    <div class="fav-mini ${isFav ? 'active' : ''}" data-fav="${inst.symbol}">★</div>
                </div>
            </div>
        `;
    }).join('');

    // Обработчики
    container.querySelectorAll('.instrument-item').forEach(item => {
        item.addEventListener('click', (e) => {
            if (e.target.classList.contains('fav-mini')) return;
            openChart(item.dataset.symbol);
        });
    });
    container.querySelectorAll('.fav-mini').forEach(star => {
        star.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleFavorite(star.dataset.fav);
        });
    });
}

function renderAllLists() {
    renderInstrumentList('list-crypto', INSTRUMENTS.crypto);
    renderInstrumentList('list-stocks', INSTRUMENTS.stocks);
    renderInstrumentList('list-currency', INSTRUMENTS.currency);
    renderFavorites();
}

function renderFavorites() {
    const container = document.getElementById('list-favorites');
    if (!container) return;
    const favItems = ALL_INSTRUMENTS.filter(i => favorites.includes(i.symbol));
    if (!favItems.length) {
        container.innerHTML = `
            <div class="empty">
                <div class="empty-icon">⭐</div>
                <div class="empty-text">Пока нет избранных</div>
                <div class="empty-hint">Нажми ★ рядом с инструментом</div>
            </div>`;
        return;
    }
    renderInstrumentList('list-favorites', favItems);
}

// ============================================
// ИЗБРАННОЕ
// ============================================
let favorites = JSON.parse(localStorage.getItem('axiom_favs') || '[]');

function toggleFavorite(sym) {
    const idx = favorites.indexOf(sym);
    if (idx === -1) favorites.push(sym);
    else favorites.splice(idx, 1);
    localStorage.setItem('axiom_favs', JSON.stringify(favorites));
    renderAllLists();
    updateStats();
    updateChartFav();
}

function updateChartFav() {
    const favEl = document.getElementById('chart-fav');
    if (!favEl) return;
    const sym = favEl.dataset.symbol;
    if (!sym) return;
    favEl.classList.toggle('active', favorites.includes(sym));
    favEl.style.color = favorites.includes(sym) ? '#ffca28' : '#4a4f5c';
}

// ============================================
// ПОЛНОЭКРАННЫЙ ГРАФИК
// ============================================
let activeChart = null;
let activeDL = null;

async function openChart(symbol) {
    const inst = ALL_INSTRUMENTS.find(i => i.symbol === symbol);
    if (!inst) return;

    document.getElementById('chart-view').classList.add('active');
    document.getElementById('chart-title').innerText = inst.name;
    document.getElementById('chart-sub').innerText = inst.sub;
    document.getElementById('chart-fav').dataset.symbol = symbol;

    // Цена
    const price = priceCache[symbol];
    document.getElementById('chart-price').innerText = price !== undefined
        ? price.toLocaleString('ru-RU', { maximumFractionDigits: 2 })
        : '--';

    // Определяем тип
    const type = INSTRUMENTS.crypto.find(i => i.symbol === symbol) ? 'crypto'
              : INSTRUMENTS.stocks.find(i => i.symbol === symbol) ? 'stocks'
              : 'currency';

    // Чистим старый график
    const container = document.getElementById('full-chart');
    container.innerHTML = '';
    if (activeChart) { try { activeChart.remove(); } catch {} }
    activeChart = null;
    activeDL = null;

    // Небольшая задержка чтобы контейнер получил размеры
    await new Promise(r => setTimeout(r, 50));

    const w = container.clientWidth;
    const h = container.clientHeight;

    activeChart = LightweightCharts.createChart(container, {
        ...baseOptions,
        width: w, height: h
    });

    const colorMap = { crypto: '#f7931a', stocks: '#21a038', currency: '#26a69a' };
    const series = activeChart.addLineSeries({
        color: colorMap[type],
        lineWidth: 2,
        priceLineVisible: true,
        lastValueVisible: true
    });

    activeDL = new DrawingLayer('full', activeChart, series);

    // Загрузка данных
    let history = [];
    try {
        if (type === 'crypto') history = await fetchCryptoHistory(symbol);
        else if (type === 'stocks') history = await fetchStockHistory(symbol);
        else history = await fetchCurrencyHistory(symbol);
    } catch (e) { console.warn('history error', e); }

    if (history.length) {
        series.setData(history);
        const last = history[history.length - 1].value;
        document.getElementById('chart-price').innerText = last.toLocaleString('ru-RU', { maximumFractionDigits: 2 });
        priceCache[symbol] = last;
    }

    // Live-обновление для крипты
    if (type === 'crypto') {
        if (window._activeWS) { try { window._activeWS.close(); } catch {} }
        const ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol.toLowerCase()}@trade`);
        window._activeWS = ws;
        ws.onmessage = (e) => {
            const d = JSON.parse(e.data);
            const p = parseFloat(d.p);
            const t = Math.floor(d.T / 1000);
            series.update({ time: t, value: p });
            document.getElementById('chart-price').innerText = p.toLocaleString('ru-RU', { maximumFractionDigits: 2 });
            priceCache[symbol] = p;
        };
        ws.onerror = () => console.warn('WS error');
    }

    updateChartFav();
}

function closeChart() {
    document.getElementById('chart-view').classList.remove('active');
    if (window._activeWS) { try { window._activeWS.close(); } catch {} window._activeWS = null; }
    if (activeChart) { try { activeChart.remove(); } catch {} activeChart = null; }
    activeDL = null;
}

document.getElementById('back-btn').addEventListener('click', closeChart);
document.getElementById('chart-fav').addEventListener('click', () => {
    const sym = document.getElementById('chart-fav').dataset.symbol;
    if (sym) toggleFavorite(sym);
});

// ============================================
// РИСОВАНИЕ (упрощённая версия для одного графика)
// ============================================
let currentTool = 'none';

class DrawingLayer {
    constructor(symbol, chart, series) {
        this.symbol = symbol;
        this.chart = chart;
        this.series = series;
        this.canvas = document.getElementById('full-canvas');
        if (!this.canvas) { this.disabled = true; return; }
        this.ctx = this.canvas.getContext('2d');
        this.drawings = [];
        this.history = [];
        this.temp = null;
        this.resize();
        this.bindEvents();
    }

    resize() {
        if (this.disabled) return;
        const parent = this.canvas.parentElement;
        const dpr = window.devicePixelRatio || 1;
        this.canvas.width = parent.clientWidth * dpr;
        this.canvas.height = parent.clientHeight * dpr;
        this.canvas.style.width = parent.clientWidth + 'px';
        this.canvas.style.height = parent.clientHeight + 'px';
        this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        this.w = parent.clientWidth;
        this.h = parent.clientHeight;
        this.redraw();
    }

    getPos(e) {
        const rect = this.canvas.getBoundingClientRect();
        if (e.touches && e.touches.length) {
            return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
        }
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    startDraw(pos) {
        const { x, y } = pos;
        if (currentTool === 'hline') {
            this.pushHistory();
            this.drawings.push({ type: 'hline', y, color: '#2962ff' });
            this.redraw(); return;
        }
        if (currentTool === 'vline') {
            this.pushHistory();
            this.drawings.push({ type: 'vline', x, color: '#2962ff' });
            this.redraw(); return;
        }
        if (currentTool === 'pencil') {
            this.pushHistory();
            this.temp = { type: 'pencil', points: [{ x, y }], color: '#ffca28' };
            this.drawings.push(this.temp); return;
        }
        this.pushHistory();
        if (currentTool === 'trend') this.temp = { type: 'trend', x1: x, y1: y, x2: x, y2: y, color: '#2962ff' };
        if (currentTool === 'rect') this.temp = { type: 'rect', x1: x, y1: y, x2: x, y2: y, color: '#2962ff' };
        if (currentTool === 'fib') this.temp = { type: 'fib', x1: x, y1: y, x2: x, y2: y, color: '#2962ff' };
        if (this.temp) this.drawings.push(this.temp);
    }

    moveDraw(pos) {
        const { x, y } = pos;
        if (currentTool === 'pencil' && this.temp) {
            this.temp.points.push({ x, y });
            this.redraw(); return;
        }
        if (!this.temp) return;
        if (['trend', 'rect', 'fib'].includes(this.temp.type)) {
            this.temp.x2 = x; this.temp.y2 = y;
            this.redraw();
        }
    }

    endDraw() {
        if (this.temp) {
            if (this.temp.type === 'trend' && Math.hypot(this.temp.x2 - this.temp.x1, this.temp.y2 - this.temp.y1) < 5) {
                this.drawings.pop(); this.history.pop();
            }
            if (this.temp.type === 'rect' && Math.abs(this.temp.x2 - this.temp.x1) < 5 && Math.abs(this.temp.y2 - this.temp.y1) < 5) {
                this.drawings.pop(); this.history.pop();
            }
        }
        this.temp = null;
        this.redraw();
    }

    bindEvents() {
        this.canvas.addEventListener('mousedown', (e) => {
            if (currentTool === 'none' || currentTool === 'eraser') return;
            e.preventDefault(); this.startDraw(this.getPos(e));
        });
        this.canvas.addEventListener('mousemove', (e) => {
            if (currentTool === 'none' || currentTool === 'eraser') return;
            this.moveDraw(this.getPos(e));
        });
        this.canvas.addEventListener('mouseup', () => this.endDraw());
        this.canvas.addEventListener('mouseleave', () => this.endDraw());

        this.canvas.addEventListener('touchstart', (e) => {
            if (currentTool === 'none' || currentTool === 'eraser') return;
            e.preventDefault(); this.startDraw(this.getPos(e));
        }, { passive: false });
        this.canvas.addEventListener('touchmove', (e) => {
            if (currentTool === 'none' || currentTool === 'eraser') return;
            e.preventDefault(); this.moveDraw(this.getPos(e));
        }, { passive: false });
        this.canvas.addEventListener('touchend', (e) => { e.preventDefault(); this.endDraw(); }, { passive: false });

        this.canvas.addEventListener('click', (e) => {
            if (currentTool !== 'eraser') return;
            const { x, y } = this.getPos(e);
            const idx = this.findNearest(x, y);
            if (idx !== -1) { this.pushHistory(); this.drawings.splice(idx, 1); this.redraw(); }
        });
    }

    pushHistory() {
        this.history.push(JSON.parse(JSON.stringify(this.drawings)));
        if (this.history.length > 50) this.history.shift();
    }

    undo() {
        if (!this.history.length) return;
        this.drawings = this.history.pop();
        this.redraw();
    }

    clear() { this.pushHistory(); this.drawings = []; this.redraw(); }

    findNearest(x, y) {
        const T = 12;
        for (let i = this.drawings.length - 1; i >= 0; i--) {
            const d = this.drawings[i];
            if (d.type === 'hline' && Math.abs(y - d.y) < T) return i;
            if (d.type === 'vline' && Math.abs(x - d.x) < T) return i;
            if (d.type === 'trend' && this.distToSeg(x, y, d.x1, d.y1, d.x2, d.y2) < T) return i;
            if (d.type === 'rect' && x >= Math.min(d.x1,d.x2)-5 && x <= Math.max(d.x1,d.x2)+5 && y >= Math.min(d.y1,d.y2)-5 && y <= Math.max(d.y1,d.y2)+5) return i;
            if (d.type === 'fib') {
                const mx = (d.x1 + d.x2) / 2;
                if (Math.abs(x - mx) < 60) {
                    for (const r of [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1]) {
                        if (Math.abs(y - (d.y1 + (d.y2 - d.y1) * r)) < T) return i;
                    }
                }
            }
            if (d.type === 'pencil') for (const p of d.points) if (Math.hypot(p.x - x, p.y - y) < T) return i;
        }
        return -1;
    }

    distToSeg(px, py, x1, y1, x2, y2) {
        const dx = x2 - x1, dy = y2 - y1, l2 = dx*dx + dy*dy;
        if (l2 === 0) return Math.hypot(px - x1, py - y1);
        let t = ((px - x1) * dx + (py - y1) * dy) / l2;
        t = Math.max(0, Math.min(1, t));
        return Math.hypot(px - (x1 + t*dx), py - (y1 + t*dy));
    }

    drawLine(x1, y1, x2, y2, c) { this.ctx.strokeStyle = c; this.ctx.lineWidth = 1.5; this.ctx.beginPath(); this.ctx.moveTo(x1, y1); this.ctx.lineTo(x2, y2); this.ctx.stroke(); }
    drawHandle(x, y, c) { this.ctx.fillStyle = c; this.ctx.beginPath(); this.ctx.arc(x, y, 4, 0, Math.PI*2); this.ctx.fill(); this.ctx.fillStyle = '#fff'; this.ctx.beginPath(); this.ctx.arc(x, y, 2, 0, Math.PI*2); this.ctx.fill(); }
    drawLabel(t, x, y, c) { this.ctx.fillStyle = c; this.ctx.font = '10px monospace'; const w = this.ctx.measureText(t).width + 6; this.ctx.fillRect(x, y - 7, w, 14); this.ctx.fillStyle = '#fff'; this.ctx.fillText(t, x + 3, y + 3); }
    priceAt(y) { const p = this.series.coordinateToPrice(y); return p !== null ? p.toFixed(2) : '--'; }

    redraw() {
        if (this.disabled) return;
        this.ctx.clearRect(0, 0, this.w, this.h);
        for (const d of this.drawings) {
            if (d.type === 'hline') { this.drawLine(0, d.y, this.w, d.y, d.color); this.drawLabel(this.priceAt(d.y), this.w - 60, d.y, d.color); }
            else if (d.type === 'vline') { this.drawLine(d.x, 0, d.x, this.h, d.color); }
            else if (d.type === 'trend') { this.drawLine(d.x1, d.y1, d.x2, d.y2, d.color); this.drawHandle(d.x1, d.y1, d.color); this.drawHandle(d.x2, d.y2, d.color); }
            else if (d.type === 'rect') { this.ctx.strokeStyle = d.color; this.ctx.lineWidth = 1.5; this.ctx.setLineDash([5,3]); this.ctx.strokeRect(d.x1, d.y1, d.x2-d.x1, d.y2-d.y1); this.ctx.setLineDash([]); this.ctx.fillStyle = d.color + '20'; this.ctx.fillRect(d.x1, d.y1, d.x2-d.x1, d.y2-d.y1); }
            else if (d.type === 'fib') {
                const levels = [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1];
                const xL = Math.min(d.x1, d.x2), xR = Math.max(d.x1, d.x2);
                const cols = ['#787b86','#ef5350','#ffa726','#ffca28','#26a69a','#42a5f5','#787b86'];
                levels.forEach((r, i) => {
                    const y = d.y1 + (d.y2 - d.y1) * r;
                    this.ctx.strokeStyle = cols[i]; this.ctx.lineWidth = 1; this.ctx.setLineDash([4,4]);
                    this.ctx.beginPath(); this.ctx.moveTo(xL, y); this.ctx.lineTo(xR, y); this.ctx.stroke();
                    this.ctx.setLineDash([]);
                    this.drawLabel(`${(r*100).toFixed(1)}% · ${this.priceAt(y)}`, xR + 5, y, cols[i]);
                });
                this.drawHandle(d.x1, d.y1, d.color); this.drawHandle(d.x2, d.y2, d.color);
            }
            else if (d.type === 'pencil') {
                if (d.points.length < 2) continue;
                this.ctx.strokeStyle = d.color; this.ctx.lineWidth = 2; this.ctx.lineCap = 'round'; this.ctx.lineJoin = 'round';
                this.ctx.beginPath(); this.ctx.moveTo(d.points[0].x, d.points[0].y);
                for (let i = 1; i < d.points.length; i++) this.ctx.lineTo(d.points[i].x, d.points[i].y);
                this.ctx.stroke();
            }
        }
    }
}

// ============================================
// ПЕРЕКЛЮЧАТЕЛЬ ИНСТРУМЕНТОВ
// ============================================
document.getElementById('tools-toggle').addEventListener('click', () => {
    const panel = document.getElementById('tools-panel');
    const toggle = document.getElementById('tools-toggle');
    const isOpen = panel.style.display !== 'none';
    panel.style.display = isOpen ? 'none' : 'flex';
    toggle.classList.toggle('hidden', !isOpen);
    // При открытии панели — активируем canvas
    const canvas = document.getElementById('full-canvas');
    if (!isOpen) canvas.classList.add('active');
    else canvas.classList.remove('active');
});

document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
    btn.addEventListener('click', () => {
        currentTool = btn.dataset.tool;
        document.querySelectorAll('.tool-btn[data-tool]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    });
});

document.getElementById('undo-btn').addEventListener('click', () => activeDL?.undo());
document.getElementById('clear-btn').addEventListener('click', () => activeDL?.clear());

// ============================================
// ПРОФИЛЬ
// ============================================
function loadProfile() {
    const fn = localStorage.getItem('axiom_firstname') || '';
    const ln = localStorage.getItem('axiom_lastname') || '';
    document.getElementById('input-firstname').value = fn;
    document.getElementById('input-lastname').value = ln;
    updateAvatar();
}

function updateAvatar() {
    const fn = document.getElementById('input-firstname').value.trim();
    const ln = document.getElementById('input-lastname').value.trim();
    document.getElementById('avatar-preview').innerText = (fn[0] || ln[0] || '?').toUpperCase();
}

function updateStats() {
    document.getElementById('stat-favs').innerText = favorites.length;
    document.getElementById('stat-instruments').innerText = ALL_INSTRUMENTS.length;
}

document.getElementById('input-firstname').addEventListener('input', updateAvatar);
document.getElementById('input-lastname').addEventListener('input', updateAvatar);

document.getElementById('save-profile').addEventListener('click', () => {
    localStorage.setItem('axiom_firstname', document.getElementById('input-firstname').value.trim());
    localStorage.setItem('axiom_lastname', document.getElementById('input-lastname').value.trim());
    const btn = document.getElementById('save-profile');
    btn.innerText = '✓ Сохранено';
    btn.classList.add('saved');
    setTimeout(() => { btn.innerText = 'Сохранить'; btn.classList.remove('saved'); }, 1500);
});

// ============================================
// НИЖНИЕ ВКЛАДКИ
// ============================================
document.querySelectorAll('.bottom-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.bottom-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('view-' + tab.dataset.view).classList.add('active');
        if (tab.dataset.view === 'favorites') renderFavorites();
        if (tab.dataset.view === 'profile') updateStats();
    });
});

// ============================================
// ОБРАБОТКА ОШИБОК
// ============================================
window.addEventListener('error', (e) => {
    const el = document.getElementById('global-status');
    if (el) { el.innerText = '❌ ' + e.message.slice(0, 40); el.className = 'status error'; }
});

// ============================================
// ГЛАВНЫЙ ЗАПУСК
// ============================================
(async () => {
    document.getElementById('global-status').innerText = 'Загрузка...';

    // Первичная загрузка цен
    await loadListPrices();
    loadProfile();

    // Обновление цен списка
    setInterval(loadListPrices, 15000);

    document.getElementById('global-status').innerText = '🟢 Live';
    document.getElementById('global-status').className = 'status live';
})();

// ============================================
// РЕСАЙЗ
// ============================================
window.addEventListener('resize', () => {
    if (activeChart) {
        const container = document.getElementById('full-chart');
        activeChart.resize(container.clientWidth, container.clientHeight);
        activeDL?.resize();
    }
});
